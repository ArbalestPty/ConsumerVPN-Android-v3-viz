# Brand configuration
#
# One file holds the identity and links for a branded build. The app module reads it at build time
# and generates the matching resources (R.string.app_name, R.string.url_*) and BuildConfig fields,
# so these values are not repeated anywhere else in the code.
#
# To build another brand, copy this file (for example to brands/acme.properties) and pass its path:
#   ./gradlew assembleMobileRelease -PbrandFile=brands/acme.properties
#
# Colours, logos and icons are not set here. See documentation/ConsumerVPN App/REBRANDING.md for the
# full checklist.
#
# The file is read as UTF-8. Values must not be empty.

# ---- Identity ----

# Name shown under the launcher icon, in system VPN settings and inside the app's text.
app.name=ConsumerVPN

# Unique ID on Google Play and on the device. Never change it after the first release.
app.applicationId=com.wlvpn.consumervpn

# ---- Links ----
# Opened in the in-app web view (phone) or shown as text and a QR code (TV).

url.forgotPassword=https://www.wlvpn.com/
url.signUp=https://www.wlvpn.com/
url.contactSupport=https://www.wlvpn.com/
url.termsOfService=https://www.wlvpn.com/
url.privacyPolicy=https://wlvpn.com/privacy-policy/
# TV "About" screen
url.aboutUs=https://www.wlvpn.com/

# ---- Content served by WLVPN ----

# Base URL for country flag images. Change only if you host your own flag set.
flags.hostname=https://static.wlvpn.com/flags/
